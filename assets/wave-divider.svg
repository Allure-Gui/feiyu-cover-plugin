    <path d="M0 4 C-1 -5, -4 -10, -14 -13 C-10 -6, -6 -3, -3 2 C-1 0, 1 0, 3 2 C6 -3, 10 -6, 14 -13 C4 -10, 1 -5, 0 4 Z"
