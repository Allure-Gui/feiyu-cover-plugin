    <path d="M0 11 V2 L9 0 V9" stroke="#24344D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="-2.2" cy="11.5" rx="3" ry="2.2" fill="#F28B72" stroke="#24344D" stroke-width="1.5"/>
    <ellipse cx="6.8" cy="9.5" rx="3" ry="2.2" fill="#F5B841" stroke="#24344D" stroke-width="1.5"/>
