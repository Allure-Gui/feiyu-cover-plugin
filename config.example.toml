[plugin]
enabled = true
config_version = "0.1.0"

[cover]
# 翻唱 API 地址：本机保持默认；远程显卡服务器填 http://服务器IP:19655
api_base = "http://127.0.0.1:19655"
api_key = ""

# 零命令自动拉起本地服务（无需手写启动/停止命令！）
auto_start_api = false
# 只需粘贴 feiyu-cover-api 文件夹路径（如 G:\feiyu-cover 或 ~/feiyu-cover-api）；留空自动探测
api_dir = ""
# 运行环境："自动识别（推荐）" | "Windows WSL2" | "本机直接运行"
api_runtime = "自动识别（推荐）"
# 插件卸载时自动关闭由本插件拉起的服务（不影响手动启动的服务）
auto_stop_api = false

# 群聊点歌策略
# 群聊发歌模式："副歌高潮直出（58秒·推荐）" | "从头分段发送（前2段×60秒）"
deliver_mode = "副歌高潮直出（58秒·推荐）"
send_song_card = true        # 唱完附带精致黑胶单曲卡（宿主渲染不可用时自动跳过）
cooldown_seconds = 600
poll_interval = 10
max_wait_seconds = 1800
notify_progress = true
cache_deliver_delay = 3

# （可选进阶）如需完全自定义启动/停止 shell 命令，可取消注释填写；留空由上方「API 文件夹路径」自动处理
# api_start_cmd = ""
# api_stop_cmd = ""
