[plugin]
enabled = true
config_version = "0.1.0"

[cover]
api_base = "http://127.0.0.1:9881"
api_key = ""
# 服务连不上时是否自动执行「启动命令」拉起 API（默认关闭）
auto_start_api = false
# 启动 API 的命令；WSL 示例：wsl.exe -d Ubuntu-24.04 -- bash /mnt/g/feiyu-cover/install/start-api.wsl.sh
# 留空则不会自动拉起，服务离线时会给出「连接不可用」提示
api_start_cmd = ""
cooldown_seconds = 600
poll_interval = 10
max_wait_seconds = 1800
notify_progress = true
