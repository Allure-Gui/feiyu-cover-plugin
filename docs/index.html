<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>麦弦（MaiChord）· 翻唱试听示例</title>
<style>
  :root{
    --warm-100:#fdf6ec; --warm-200:#f6e6cf; --accent:#d97b38;
    --accent-dark:#b85f22; --ink:#24344d; --muted:#6b7688;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    background:linear-gradient(160deg,#fffdf8 0%,#f5ebd9 100%);
    color:var(--ink);display:flex;align-items:center;justify-content:center;
    padding:24px;-webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%;max-width:440px;background:#fff;border-radius:22px;
    padding:40px 34px 34px;text-align:center;
    box-shadow:0 18px 50px rgba(36,52,77,.12);
  }
  .logo{width:88px;height:88px;border-radius:22px;margin:0 auto 20px;
    box-shadow:0 8px 22px rgba(217,123,56,.22)}
  h1{font-size:21px;margin:0 0 6px;color:var(--ink);letter-spacing:.4px}
  .sub{font-size:13px;color:var(--muted);margin:0 0 28px}
  .song{background:var(--warm-100);border-radius:14px;padding:18px;margin-bottom:22px}
  .song-title{font-size:16px;font-weight:600;margin-bottom:4px}
  .song-meta{font-size:12px;color:var(--muted)}
  audio{width:100%;height:42px}
  .back{display:inline-block;margin-top:26px;font-size:13px;
    color:var(--accent-dark);text-decoration:none}
  .back:hover{text-decoration:underline}
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="https://cdn.jsdelivr.net/gh/Allure-Gui/feiyu-cover-plugin@main/assets/icon.png" alt="麦弦">
    <h1>麦弦 · 翻唱试听示例</h1>
    <p class="sub">MaiBot 翻唱与声学工作室插件 · 实录效果演示</p>
    <div class="song">
      <div class="song-title">《雨爱》</div>
      <div class="song-meta">RVC 翻唱完整版 · 4 分 21 秒</div>
    </div>
    <audio controls src="https://cdn.jsdelivr.net/gh/Allure-Gui/feiyu-cover-plugin@v0.2.1/assets/demo-yuai.mp3"></audio>
    <a class="back" href="https://github.com/Allure-Gui/feiyu-cover-plugin">← 返回插件仓库</a>
  </div>
</body>
</html>
