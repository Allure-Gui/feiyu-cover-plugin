<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鲸歌 · 试听示例</title>
<style>
  :root{
    --blue-100:#eaf0fb; --blue-200:#cbddfe; --blue-400:#8fa9d8;
    --blue-600:#4264a8; --ink:#1e2b45; --muted:#71809c;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    background:linear-gradient(160deg,#f5f8ff 0%,#cbddfe 100%);
    color:var(--ink);display:flex;align-items:center;justify-content:center;
    padding:24px;-webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%;max-width:440px;background:#fff;border-radius:22px;
    padding:40px 34px 34px;text-align:center;
    box-shadow:0 18px 50px rgba(66,100,168,.18);
  }
  .logo{width:88px;height:88px;border-radius:22px;margin:0 auto 20px;
    box-shadow:0 8px 22px rgba(66,100,168,.22)}
  h1{font-size:21px;margin:0 0 6px;color:var(--blue-600);letter-spacing:.5px}
  .sub{font-size:13px;color:var(--muted);margin:0 0 28px}
  .song{background:var(--blue-100);border-radius:14px;padding:18px;margin-bottom:22px}
  .song-title{font-size:16px;font-weight:600;margin-bottom:4px}
  .song-meta{font-size:12px;color:var(--muted)}
  audio{width:100%;height:42px}
  .back{display:inline-block;margin-top:26px;font-size:13px;
    color:var(--blue-600);text-decoration:none}
  .back:hover{text-decoration:underline}
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="https://cdn.jsdelivr.net/gh/Allure-Gui/feiyu-cover-plugin@main/assets/icon.png" alt="鲸歌">
    <h1>鲸歌 · 试听示例</h1>
    <p class="sub">麦麦翻唱插件 · 音色效果演示</p>
    <div class="song">
      <div class="song-title">《雨爱》</div>
      <div class="song-meta">翻唱片段 · 约 30 秒</div>
    </div>
    <audio controls src="https://cdn.jsdelivr.net/gh/Allure-Gui/feiyu-cover-plugin@main/assets/demo-yuai.mp3"></audio>
    <a class="back" href="https://github.com/Allure-Gui/feiyu-cover-plugin">← 返回插件仓库</a>
  </div>
</body>
</html>
