<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鲸歌 · 音色工作室</title>
<style>
  :root{
    --bg:#eef3f5; --panel:#fff; --ink:#16323d; --ink-soft:#5b7480; --ink-faint:#8ba3ad;
    --line:#e3ebee; --accent:#1f8f8a; --accent-soft:#e4f4f2; --accent-deep:#116b6b;
    --warn:#c9702a;
    --shadow:0 8px 24px rgba(22,50,61,.07);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  .shell{display:flex;flex-direction:column;height:100vh}
  .top{display:flex;align-items:center;gap:14px;padding:12px 18px;
    background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto}
  .logo{width:40px;height:40px;border-radius:12px;overflow:hidden;flex:0 0 auto;
    border:1px solid #d5e8e6;background:linear-gradient(160deg,#d9f0ee,#eef7f6)}
  .logo img{width:100%;height:100%;object-fit:cover}
  .top h1{font-size:16px;margin:0}
  .top .sub{font-size:11.5px;color:var(--ink-faint);margin-top:2px}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:9px}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 10px;
    border-radius:999px;background:#f2f6f7;color:var(--ink-soft);border:1px solid var(--line);white-space:nowrap}
  .pill .dot{width:7px;height:7px;border-radius:50%;background:#b9c8ce}
  .pill.ok{background:var(--accent-soft);color:var(--accent-deep);border-color:#cfe9e6}
  .pill.ok .dot{background:var(--accent)}
  .pill.bad{background:#fdeee4;color:var(--warn);border-color:#f6ddc9}
  .pill.bad .dot{background:var(--warn)}

  button{font-family:inherit;cursor:pointer}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);
    padding:8px 14px;border-radius:10px;font-size:12.5px;transition:.15s}
  .btn:hover{border-color:#c9dbe0;transform:translateY(-1px)}
  .btn.primary{background:linear-gradient(160deg,#229c95,#157a7a);color:#fff;border:none;
    box-shadow:0 5px 14px rgba(21,122,122,.22)}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn.block{width:100%}
  .btn:disabled{opacity:.45;cursor:default;transform:none}

  .body{display:grid;grid-template-columns:minmax(460px,1fr) 344px;
    gap:12px;padding:12px;flex:1 1 auto;min-height:0}
  .col{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .col-hd{padding:12px 14px 9px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .col-hd .t{font-size:13px;font-weight:600}
  .col-hd .d{font-size:11.5px;color:var(--ink-faint);margin-top:3px}
  .col-bd{padding:10px 12px;overflow-y:auto;flex:1 1 auto;min-height:0}
  .col-ft{padding:10px 12px;border-top:1px solid var(--line);flex:0 0 auto}

  .search{width:100%;border:1px solid var(--line);border-radius:9px;padding:7px 10px;
    font-size:12.5px;font-family:inherit;color:var(--ink);background:#fafcfc}
  .search:focus{outline:2px solid var(--accent-soft);border-color:#bfd9dd}
  .sess{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:10px;
    cursor:pointer;border:1px solid transparent;transition:.14s;margin-bottom:2px}
  .sess:hover{background:#f6fafb}
  .sess.on{background:var(--accent-soft);border-color:#cfe9e6}
  .avatar{width:28px;height:28px;border-radius:9px;flex:0 0 auto;display:flex;
    align-items:center;justify-content:center;font-size:12px;font-weight:600;
    background:#e8eff2;color:#5b7480}
  .sess.on .avatar{background:#bde4e0;color:#0f5f5f}
  .sess .nm{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sess .tag{font-size:10px;color:var(--ink-faint);margin-left:auto;flex:0 0 auto}
  .empty{font-size:12px;color:var(--ink-faint);padding:16px 6px;text-align:center;line-height:1.7}

  .songbox{margin-bottom:12px}
  .songbox label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px}
  .songbox input{width:100%;border:1px solid var(--line);border-radius:11px;
    padding:11px 13px;font-size:14px;font-family:inherit;color:var(--ink);background:#fafcfc}
  .songbox input:focus{outline:2px solid var(--accent-soft);border-color:#bfd9dd}
  .presets{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
  .chip{border:1px solid var(--line);background:#fff;color:var(--ink-soft);
    padding:6px 12px;border-radius:999px;font-size:11.5px;transition:.15s}
  .chip:hover{border-color:#c9dbe0;color:var(--ink)}
  .chip.on{background:var(--accent-soft);border-color:#cfe9e6;color:var(--accent-deep);font-weight:600}

  .pcard{border:1px solid var(--line);border-radius:13px;padding:12px 13px 10px;
    margin-bottom:9px;transition:.16s}
  .pcard:hover{border-color:#d6e6ea}
  .pcard .r{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .pcard .nm{font-size:13px;font-weight:600}
  .pcard .v{font-size:12px;color:var(--accent-deep);background:var(--accent-soft);
    padding:1px 8px;border-radius:7px;font-variant-numeric:tabular-nums}
  .pcard .hint{margin:7px 0 0;font-size:11.5px;line-height:1.65;color:var(--ink-faint)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;
    margin:6px 0 0;background:transparent}
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:99px;
    background:linear-gradient(90deg,var(--accent) var(--p,50%),#e3ecef var(--p,50%))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;
    border-radius:50%;background:#fff;border:3px solid var(--accent);margin-top:-6px;
    box-shadow:0 2px 6px rgba(21,122,122,.28)}
  .switch{position:relative;width:42px;height:24px;flex:0 0 auto}
  .switch input{opacity:0;width:0;height:0}
  .switch .sl{position:absolute;inset:0;background:#dfe8ea;border-radius:999px;
    transition:.2s;cursor:pointer}
  .switch .sl::before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;
    background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.16)}
  .switch input:checked + .sl{background:var(--accent)}
  .switch input:checked + .sl::before{transform:translateX(18px)}
  select{width:100%;font-family:inherit;font-size:12.5px;color:var(--ink);
    border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;margin-top:8px}

  .status{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fafcfc}
  .status .line1{display:flex;justify-content:space-between;align-items:center;font-size:12.5px}
  .status .step{color:var(--accent-deep);font-weight:600}
  .bar{height:6px;border-radius:99px;background:#e3ecef;margin:10px 0 6px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,#2bb0a8,#1f8f8a);transition:width .4s}
  .status .msg{font-size:11.5px;color:var(--ink-faint);line-height:1.6}
  .linkbox{display:flex;gap:7px;margin-top:12px}
  .linkbox input{flex:1 1 auto;min-width:0;font-size:11.5px;color:var(--ink-soft);
    border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:#fafcfc;
    font-family:ui-monospace,Menlo,monospace}
  .linkbox .btn{flex:0 0 auto;padding:7px 11px}
  .tip{font-size:11px;color:var(--ink-faint);line-height:1.65;margin-top:7px}
  .ph{margin-top:12px;border:1px dashed #d7e4e8;border-radius:12px;padding:26px 12px;
    text-align:center;color:var(--ink-faint);font-size:12px;line-height:1.8}
  .sendbox{margin-top:12px}
  .row2{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .row2 select{flex:1 1 auto;min-width:0;margin-top:0;padding:8px 9px}
  .row2 .btn{flex:0 0 auto;padding:8px 11px}
  .sendbox .lbl{font-size:11.5px;color:var(--ink-faint);margin-bottom:7px}
  .sendbox .target{font-size:12.5px;color:var(--ink);background:#f4f8f9;
    border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:8px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hist{margin-top:14px}
  .hist .t{font-size:11.5px;color:var(--ink-faint);margin-bottom:6px}
  .hitem{font-size:12px;padding:7px 9px;border-radius:8px;color:var(--ink-soft);
    cursor:pointer;display:flex;gap:8px;align-items:center}
  .hitem:hover{background:#f6fafb;color:var(--ink)}
  .hitem .s{margin-left:auto;font-size:10.5px;color:var(--ink-faint)}

  #toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,18px);
    background:#16323d;color:#fff;font-size:12.5px;padding:10px 16px;border-radius:11px;
    box-shadow:0 12px 30px rgba(22,50,61,.28);opacity:0;pointer-events:none;transition:.24s;z-index:9}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast.err{background:#a4451c}

  @media (max-width:1080px){
    .body{grid-template-columns:minmax(380px,1fr) 300px}
  }
</style>
</head>

          <div class="lbl">发送到</div>
          <div class="row2">
            <select id="sessSel"><option value="">未选择会话</option></select>
            <button class="btn" id="btnLoadSess">加载会话</button>
          </div>
          <button class="btn primary block" id="btnSend" disabled>发送到聊天</button>
        </div>
        <div class="hist" id="hist"></div>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
(function () {
  "use strict";
  var S = { voice:{}, defaults:{}, limits:{}, f0:[], apiBase:"", sessions:[], session:null, job:null, timer:null, hist:[], models:[] };

  var META = {
    pitch:{ title:"变调", unit:" 半音", step:1, fmt:function(v){return (v>0?"+":"")+v;},
      hint:"整首歌升高或降低几个半音。0 是原调；男声歌改女声填 12，女声歌想更甜试 +2 到 +4。改了伴奏会跟着变调。" },
    index_rate:{ title:"音色贴合度", step:0.01, fmt:function(v){return Number(v).toFixed(2);},
      hint:"多大程度向鲸歌的音色靠拢。太高会把咬字抹平、听起来糊；太低又不像本人。" },
    protect:{ title:"辅音保护", step:0.01, fmt:function(v){return Number(v).toFixed(2);},
      hint:"保护 s、sh、z 这类齿音不被改写。调高咬字清楚但可能发闷，调低会出金属音。" },
    volume_envelope:{ title:"音量包络", step:0.01, fmt:function(v){return Number(v).toFixed(2);},
      hint:"保留原唱强弱起伏的比例。越大越有感情，越小越平稳但发虚。" },
    formant_qfrency:{ title:"共振峰频率", step:0.01, fmt:function(v){return Number(v).toFixed(2);},
      hint:"只改音色的年龄感，不动音高，伴奏不用跟着变调。大于 1 更年轻，想可爱就往 1.2 以上试。" }
  };

  var PRESETS = {
    default:{ pitch:0, index_rate:0.42, protect:0.35, volume_envelope:0.75, formant_shifting:true, formant_qfrency:1.2,  f0_method:"rmvpe" },
    sweet:  { pitch:2, index_rate:0.55, protect:0.32, volume_envelope:0.76, formant_shifting:true, formant_qfrency:1.26, f0_method:"rmvpe" },
    bright: { pitch:0, index_rate:0.45, protect:0.3,  volume_envelope:0.8,  formant_shifting:true, formant_qfrency:1.3,  f0_method:"rmvpe" },
    mature: { pitch:-1, index_rate:0.55, protect:0.38, volume_envelope:0.72, formant_shifting:true, formant_qfrency:0.92, f0_method:"rmvpe" },
    clear:  { pitch:0, index_rate:0.35, protect:0.4,  volume_envelope:0.78, formant_shifting:true, formant_qfrency:1.18, f0_method:"rmvpe" }
  };

  function $(s){ return document.querySelector(s); }
  function esc(v){ return String(v==null?"":v).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  var tTimer=null;
  function toast(msg, err){
    var el=$("#toast"); el.textContent=msg; el.className="show"+(err?" err":"");
    clearTimeout(tTimer); tTimer=setTimeout(function(){ el.className=""; },2600);
  }
  function pct(v,lo,hi){ return Math.max(0,Math.min(100,((Number(v)-lo)/(hi-lo))*100)); }

  function paintSessions(){
    var sel=$("#sessSel");
    var opts=['<option value="">未选择会话</option>'];
    S.sessions.forEach(function(s){
      var on=S.session&&S.session.stream_id===s.stream_id;
      opts.push('<option value="'+esc(s.stream_id)+'"'+(on?" selected":"")+'>'+
        esc(s.name)+(s.is_group?"（群）":"（私）")+'</option>');
    });
    if(!S.sessions.length) opts=['<option value="">点右侧「加载会话」</option>'];
    sel.innerHTML=opts.join("");
  }
  function paintSendTarget(){
    $("#btnSend").disabled=!(S.job&&S.job.status==="done"&&S.session);
  }
  function bindSessionSelect(){
    $("#sessSel").addEventListener("change",function(e){
      var sid=e.target.value;
      S.session=S.sessions.find(function(x){ return x.stream_id===sid; })||null;
      paintSendTarget();
    });
  }
  function loadSessions(){
    var btn=$("#btnLoadSess"); btn.disabled=true; btn.textContent="加载中…";
    maibot.query("sessions",{platform:"qq"}).then(function(r){
      S.sessions=r.sessions||[];
      paintSessions();
      var sel=$("#sessSel");
      if(S.sessions.length===1){ sel.selectedIndex=1; S.session=S.sessions[0]; paintSendTarget(); }
      if(!S.sessions.length) toast("没有读到会话，先在群里发条消息试试",true);
      else toast("已加载 "+S.sessions.length+" 个会话");
    }).catch(function(e){ toast("加载失败："+(e.message||e),true); })
      .then(function(){ btn.disabled=false; btn.textContent="加载会话"; });
  }

  function setVal(k,v){
    S.voice[k]=v;
    var b=document.querySelector('[data-badge="'+k+'"]');
    var i=document.querySelector('[data-input="'+k+'"]');
    if(b&&META[k]) b.textContent=META[k].fmt(v)+(META[k].unit||"");
    if(i&&i.type==="range"&&S.limits[k]) i.style.setProperty("--p",pct(v,S.limits[k][0],S.limits[k][1])+"%");
  }
  function applyPreset(name){
    var p=PRESETS[name]; if(!p) return;
    Object.keys(p).forEach(function(k){ if(k in S.voice) setVal(k,p[k]); });
    var tg=document.querySelector('[data-input="formant_shifting"]'); if(tg) tg.checked=!!p.formant_shifting;
    Array.prototype.forEach.call(document.querySelectorAll(".chip"),function(c){
      c.classList.toggle("on",c.getAttribute("data-preset")===name); });
  }
  function card(k,lo,hi){
    var m=META[k], v=S.voice[k];
    return '<div class="pcard"><div class="r"><span class="nm">'+esc(m.title)+'</span>'+
      '<span class="v" data-badge="'+k+'">'+esc(m.fmt(v)+(m.unit||""))+'</span></div>'+
      '<input type="range" data-input="'+k+'" min="'+lo+'" max="'+hi+'" step="'+(m.step||0.01)+'" value="'+v+'">'+
      '<p class="hint">'+esc(m.hint)+'</p></div>';
  }
  function paintParams(){
    var v=S.voice,l=S.limits;
    var h="";

    // 音色版本
    var mopts="", curLabel="原版声库";
    if(S.models.length){
      mopts=S.models.map(function(m){
        var sel=(v.model? m.model===v.model : m.id==="default");
        var lbl=m.label+(m.recommended?"（推荐）":"");
        if(sel) curLabel=lbl;
        return '<option value="'+esc(m.id)+'"'+(sel?" selected":"")+'>'+esc(lbl)+'</option>';
      }).join("");
    }else{
      mopts='<option value="">（未读取到模型列表）</option>';
    }
    h+='<div class="pcard"><div class="r"><span class="nm">音色版本</span>'+
       '<span class="v">'+esc(curLabel)+'</span></div>'+
       '<select data-input="model">'+mopts+'</select>'+
       '<p class="hint">切换训练好的权重。切换后每次生成都用这个音色，群里点歌也走它。选「默认」就用 config.json 里配置的原版声库。</p></div>';
    h+=card("pitch",l.pitch[0],l.pitch[1]);
    h+=card("index_rate",l.index_rate[0],l.index_rate[1]);
    h+=card("protect",l.protect[0],l.protect[1]);
    h+=card("volume_envelope",l.volume_envelope[0],l.volume_envelope[1]);
    h+=card("formant_qfrency",l.formant_qfrency[0],l.formant_qfrency[1]);
    h+='<div class="pcard"><div class="r"><span class="nm">共振峰偏移</span>'+
       '<label class="switch"><input type="checkbox" data-input="formant_shifting"'+(v.formant_shifting?" checked":"")+
       '><span class="sl"></span></label></div>'+
       '<p class="hint">上面「共振峰频率」的总开关。关掉就完全不调年龄感，声音最接近模型原样。</p></div>';
    var opts=(S.f0||[]).map(function(m){
      var label={rmvpe:"rmvpe（最稳，推荐）",fcpe:"fcpe（更快）",crepe:"crepe（更准但慢）",harvest:"harvest（传统）",pm:"pm（最快，音质差）"}[m]||m;
      return '<option value="'+esc(m)+'"'+(m===v.f0_method?" selected":"")+'>'+label+'</option>'; }).join("");
    h+='<div class="pcard"><div class="r"><span class="nm">基频算法</span></div>'+
       '<select data-input="f0_method">'+opts+'</select>'+
       '<p class="hint">决定怎么提取原唱音高。rmvpe 在唱歌上最稳，没有特别理由不用改。</p></div>';

    $("#params").innerHTML=h;
    Array.prototype.forEach.call(document.querySelectorAll('input[type=range]'),function(el){
      var k=el.getAttribute("data-input"), lim=S.limits[k];
      el.style.setProperty("--p",pct(el.value,lim[0],lim[1])+"%");
      el.addEventListener("input",function(){ setVal(k,Number(el.value)); });
    });
    document.querySelector('[data-input="formant_shifting"]').addEventListener("change",function(e){
      S.voice.formant_shifting=e.target.checked; });
    document.querySelector('[data-input="f0_method"]').addEventListener("change",function(e){
      S.voice.f0_method=e.target.value; });
    var msel=document.querySelector('[data-input="model"]');
    if(msel) msel.addEventListener("change",function(e){
      var pick=S.models.find(function(m){ return m.id===e.target.value; });
      if(pick){ S.voice.model=pick.model; S.voice.index=pick.index; }
      else { S.voice.model=""; S.voice.index=""; }
      paintParams();
    });
  }

  function paintHist(){
    if(!S.hist.length){ $("#hist").innerHTML=""; return; }
    $("#hist").innerHTML='<div class="t">本次调试记录</div>'+S.hist.slice(0,8).map(function(id){
      return '<div class="hitem" data-jid="'+esc(id)+'">🎵 <span>'+esc(id)+'</span><span class="s">试听</span></div>';
    }).join("");
    Array.prototype.forEach.call(document.querySelectorAll(".hitem"),function(el){
      el.addEventListener("click",function(){
        var id=el.getAttribute("data-jid");
        S.job={id:id,status:"done",progress:1,message:"完成"};
        paintJob();
      });
    });
  }

  function paintJob(){
    var j=S.job; if(!j) return;
    var names={queued:"排队中",downloading:"找歌中",separating:"分离人声",converting:"换声中",mixing:"混音中",done:"完成",failed:"失败"};
    var pv=Math.round((j.progress||0)*100);
    $("#stStep").textContent=names[j.status]||j.status;
    $("#stPct").textContent=pv+"%";
    $("#stBar").style.width=pv+"%";
    $("#stMsg").textContent=j.error||j.message||"";
    $("#jobId").textContent="任务 "+j.id;
    if(j.status==="done"){
      var url=S.apiBase+'/jobs/'+j.id+'/audio';
      $("#player").innerHTML=
        '<div class="linkbox"><input id="audioUrl" readonly value="'+esc(url)+'">'+
        '<button class="btn" id="btnCopy">复制链接</button></div>'+
        '<div class="tip">宿主页面禁止直接播放外部音频，复制链接贴到浏览器就能听；或者直接发送到群里。</div>';
      $("#btnCopy").addEventListener("click",function(){
        var inp=$("#audioUrl"); inp.select();
        var okCopy=false;
        try{ okCopy=document.execCommand("copy"); }catch(e){}
        if(!okCopy&&navigator.clipboard){ navigator.clipboard.writeText(url).then(function(){
          toast("链接已复制，去浏览器粘贴"); },function(){ inp.select(); toast("已选中，按 Ctrl+C 复制"); }); return; }
        toast(okCopy?"链接已复制，去浏览器粘贴":"已选中，按 Ctrl+C 复制");
      });
      if(S.hist.indexOf(j.id)<0){ S.hist.unshift(j.id); paintHist(); }
    }else if(j.status==="failed"){
      $("#player").innerHTML='<div class="ph">生成失败<br>'+esc(j.error||"看服务端日志")+'</div>';
    }
    paintSendTarget();
  }

  function poll(){
    if(!S.job||!S.job.id) return;
    maibot.query("job",{job_id:S.job.id}).then(function(r){
      S.job=r; paintJob();
      if(r.status==="done"||r.status==="failed"){ clearInterval(S.timer); S.timer=null; }
    }).catch(function(e){ clearInterval(S.timer); S.timer=null; toast("查询失败："+(e.message||e),true); });
  }
  function startRender(){
    var song=($("#song").value||"").trim();
    if(!song){ toast("先填歌名",true); $("#song").focus(); return; }
    var btn=$("#btnRender"); btn.disabled=true; btn.textContent="提交中…";
    var payload=JSON.stringify({song:song,voice:S.voice});
    maibot.action("render",{payload:payload}).then(function(r){
      S.job={id:r.job_id,status:"queued",progress:0,message:"排队中"};
      paintJob();
      $("#player").innerHTML='<div class="ph">生成中…<br>一首歌约 40 到 90 秒</div>';
      clearInterval(S.timer); S.timer=setInterval(poll,2500);
      toast("已提交，排队第 "+r.queue_position+" 位");
    }).catch(function(e){ toast("提交失败："+(e.message||e),true); })
      .then(function(){ btn.disabled=false; btn.textContent="开始翻唱"; });
  }
  function doSend(){
    if(!S.job||!S.session) return;
    var btn=$("#btnSend"); btn.disabled=true; btn.textContent="发送中…";
    maibot.action("send",{
      job_id:S.job.id, stream_id:S.session.stream_id,
      group_id:S.session.group_id||"", user_id:S.session.user_id||""
    }).then(function(){ toast("已发送到 "+S.session.name); })
      .catch(function(e){ toast("发送失败："+(e.message||e),true); })
      .then(function(){ btn.disabled=false; btn.textContent="发送到聊天"; });
  }
  function doSave(){
    maibot.action("save",{payload:JSON.stringify(S.voice)})
      .then(function(r){ if(r&&r.voice) S.voice=r.voice; toast("音色参数已保存，群里点歌生效"); })
      .catch(function(e){ toast("保存失败："+(e.message||e),true); });
  }

  async function init(){
    if(typeof maibot==="undefined"){
      $("#params").innerHTML='<div class="empty">请在麦麦 WebUI 中打开此页面</div>'; return;
    }
    try{
      await maibot.ready;
      var st=await maibot.query("state");
      S.voice=st.voice||{}; S.defaults=st.defaults||{}; S.limits=st.limits||{};
      S.f0=st.f0_methods||[]; S.apiBase=st.api_base||"";
      var h=st.health||{ok:false,message:"未知"};
      $("#health").className="pill "+(h.ok?"ok":"bad");
      $("#healthText").textContent=h.message;
      paintParams();

      maibot.query("models").then(function(r){
        S.models=r.models||[];
        if(!S.voice.model && r.selected){
          S.voice.model=r.selected.model||"";
          S.voice.index=r.selected.index||"";
        }
        paintParams();
      }).catch(function(){});

      bindSessionSelect();
      loadSessions();
    }catch(e){
      $("#params").innerHTML='<div class="empty">读取失败：'+esc(e.message||e)+'</div>';
    }
  }

  $("#presets").addEventListener("click",function(e){
    var b=e.target.closest("[data-preset]"); if(b) applyPreset(b.getAttribute("data-preset")); });
  $("#btnSave").addEventListener("click",doSave);
  $("#btnRender").addEventListener("click",startRender);
  $("#btnSend").addEventListener("click",doSend);
  $("#btnLoadSess").addEventListener("click",loadSessions);
  $("#song").addEventListener("keydown",function(e){ if(e.key==="Enter") startRender(); });
  init();
})();
</script>
</body>
</html>
